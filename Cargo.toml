[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/frame-demo"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/AldeaG72/pc-optimizer"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
