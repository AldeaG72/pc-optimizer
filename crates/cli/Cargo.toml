[package]
name = "pco-cli"
description = "Command-line interface (pco) for PC Optimizer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "pco_cli"
path = "src/lib.rs"

[[bin]]
name = "pco"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
pco-core = { path = "../core" }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Globalization"] }

[dev-dependencies]
serde_json = "1.0.154"
