[package]
name = "pco-helper"
description = "Elevated helper for PC Optimizer: applies and undoes recipes by ID, nothing else"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pco_helper"
path = "src/lib.rs"

[[bin]]
name = "pco-helper"
path = "src/main.rs"

[dependencies]
pco-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(windows)".dev-dependencies]
# The CI benchmark test presses Ctrl+Shift+F10 like the user would.
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
