[package]
name = "pco-core"
description = "Recipe engine, undo journal and Windows backends for PC Optimizer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pco_core"

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Services"] }
