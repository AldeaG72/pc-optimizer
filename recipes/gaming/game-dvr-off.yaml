id: gaming.game-dvr-off
version: 1
name:
  ro: Captură în fundal (Game DVR) oprită
  en: Background capture (Game DVR) off
description:
  ro: Oprește înregistrarea video automată din Xbox Game Bar.
  en: Turns off automatic background recording in Xbox Game Bar.
category: gaming
risk: safe
profiles: [recommended, laptop]
impact:
  ro: Mediu pe plăci video slabe, mic pe cele puternice
  en: Medium on weak GPUs, low on strong ones
why:
  ro: Înregistrarea în fundal consumă resurse de GPU și CPU chiar dacă nu o folosești niciodată.
  en: Background recording uses GPU and CPU resources even if you never use it.
breaks:
  ro: Captura video cu Win+Alt+R nu mai funcționează.
  en: Video capture with Win+Alt+R stops working.
requires_restart: none
platform:
  min_build: 22000
sources:
  - https://support.microsoft.com/windows/record-a-game-clip-on-your-pc-with-xbox-game-bar
  # Community answers on Microsoft Q&A naming both values below.
  - https://learn.microsoft.com/en-us/answers/questions/3738984/how-to-disable-xbox-game-bar
  # The documented alternative is the AllowGameDVR policy (HKLM, all users, shows "managed by
  # your organization"). Not used, by owner decision (2026-11-20): this recipe matches the
  # per-user toggle instead.
  - https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-applicationmanagement
# Docs: neither value is documented by Microsoft (checked 2026-11-20). Stays `false`.
verified: false
actions:
  - type: registry
    hive: HKCU
    key: System\GameConfigStore
    value: GameDVR_Enabled
    kind: dword
    set: 0
  - type: registry
    hive: HKCU
    key: Software\Microsoft\Windows\CurrentVersion\GameDVR
    value: AppCaptureEnabled
    kind: dword
    set: 0
