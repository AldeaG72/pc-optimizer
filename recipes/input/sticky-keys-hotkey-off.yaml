id: input.sticky-keys-hotkey-off
version: 2
name:
  ro: Scurtătura Sticky Keys oprită
  en: Sticky Keys shortcut off
description:
  ro: Shift apăsat de 5 ori nu mai deschide fereastra Sticky Keys în timpul jocului.
  en: Pressing Shift 5 times no longer opens the Sticky Keys dialog while gaming.
category: input
risk: safe
profiles: [recommended, laptop]
impact:
  ro: Confort, fără efect pe FPS
  en: Comfort, no FPS effect
why:
  ro: Fereastra Sticky Keys poate scoate jocul din fullscreen în mijlocul unei runde.
  en: The Sticky Keys dialog can pull the game out of fullscreen mid-round.
breaks:
  ro: Nimic; Sticky Keys rămâne disponibil din Setări › Accesibilitate.
  en: Nothing; Sticky Keys stays available in Settings › Accessibility.
requires_restart: signout
platform:
  min_build: 22000
sources:
  # STICKYKEYS flags: SKF_HOTKEYACTIVE = 0x00000004 ("press SHIFT five times").
  # The Windows default 510 (0x1FE) without that bit is 506 (0x1FA).
  - https://learn.microsoft.com/windows/win32/api/winuser/ns-winuser-stickykeys
  # Community answers on Microsoft Q&A naming this registry value and 510 → 506.
  - https://learn.microsoft.com/en-us/answers/questions/151522/disabling-stickey-dialog
# Docs: the flag values are documented; the registry location (REG_SZ "Flags") is not
# (checked 2026-11-20). Stays `false`.
# `only_if: "510"`: changed only from the Windows default, so other Sticky Keys options a user
# chose (e.g. Sticky Keys on = 511) are never overwritten (owner decision, 2026-11-20).
# Later: clear just the one bit, or use SystemParametersInfo(SPI_SETSTICKYKEYS).
verified: false
actions:
  - type: registry
    hive: HKCU
    key: Control Panel\Accessibility\StickyKeys
    value: Flags
    kind: string
    set: "506"
    only_if: "510"
