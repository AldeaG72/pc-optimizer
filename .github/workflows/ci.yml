# Stage 0 CI (ETAPA-0, task 0.11).
# - fmt, clippy and the normal tests on Linux and Windows;
# - `real-recipes`: every recipe applied and undone on a real, throwaway Windows runner.
#   This is the only place real tweaks run (CLAUDE.md, safety rule 1).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  real-recipes:
    name: real recipes on Windows 11-level build (apply → undo)
    needs: test
    # Windows Server 2025 = build 26100, the same kernel as Windows 11 24H2.
    runs-on: windows-2025
    env:
      PCO_CI_REAL_TWEAKS: "1"
      PCO_CI_TEST_SERVICE: PcoCiTestSvc
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal

      - name: Create a throwaway service for the service tests
        shell: pwsh
        run: |
          sc.exe create PcoCiTestSvc binPath= "C:\Windows\System32\svchost.exe -k PcoCiTestSvc" start= demand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and undo every recipe for real
        run: cargo test -p pco-core --test real_recipes -- --ignored --test-threads=1 --nocapture

      - name: Smoke-test the pco binary
        shell: pwsh
        run: |
          $env:PCO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pco'
          cargo run -q -p pco-cli -- --lang en list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -q -p pco-cli -- --lang ro status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Interrupted apply is undone at the next start (exit criterion 2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PCO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pco-interrupt'
          $snaps = Join-Path $env:RUNNER_TEMP 'snaps'
          $key = 'HKCU\Software\Microsoft\GameBar'
          cargo build -q -p pco-cli
          $pco = '.\target\debug\pco.exe'

          # Give Game Mode something to change (it is the first recipe written), remembering
          # the runner's own value.
          $orig = reg.exe query $key /v AutoGameModeEnabled 2>$null
          $hadValue = $LASTEXITCODE -eq 0
          reg.exe add $key /v AutoGameModeEnabled /t REG_DWORD /d 0 /f | Out-Null

          ./scripts/vm-snapshot.ps1 -Out "$snaps\before"

          # Stop abruptly right after the first change, like a crash.
          $env:PCO_TEST_STOP_AFTER_CHANGES = '1'
          & $pco --lang en apply gaming.game-mode-on gaming.game-dvr-off privacy.advertising-id-off
          if ($LASTEXITCODE -ne 99) { throw "expected the deliberate stop (99), got $LASTEXITCODE" }
          Remove-Item Env:PCO_TEST_STOP_AFTER_CHANGES

          # The next start must undo it and say so.
          $out = (& $pco --lang en status) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "pco status failed: $LASTEXITCODE" }
          if ($out -notmatch 'was interrupted\. I undid it automatically: 1 changes restored') {
            throw 'the recovery message is missing'
          }
          ./scripts/vm-snapshot.ps1 -Out "$snaps\after" -CompareWith "$snaps\before"
          if ($LASTEXITCODE -ne 0) { throw 'the registry is not exactly as before' }

          # Put the runner's own value back.
          if ($hadValue) {
            $data = ($orig | Select-String 'AutoGameModeEnabled').ToString().Trim() -split '\s+' | Select-Object -Last 1
            reg.exe add $key /v AutoGameModeEnabled /t REG_DWORD /d ([Convert]::ToInt32($data, 16)) /f | Out-Null
          } else {
            reg.exe delete $key /v AutoGameModeEnabled /f | Out-Null
          }

      - name: Remove the throwaway service
        if: always()
        shell: pwsh
        run: sc.exe delete PcoCiTestSvc
