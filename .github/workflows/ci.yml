# Stage 0 CI (ETAPA-0, task 0.11).
# - fmt, clippy and the normal tests on Linux and Windows;
# - `real-recipes`: every recipe applied and undone on a real, throwaway Windows runner.
#   This is the only place real tweaks run (CLAUDE.md, safety rule 1).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy
      - name: cargo clippy (errors shown as annotations)
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --color never --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log; then
            msg=$(grep -E -A8 '^(error|warning)' clippy.log | head -60 | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=clippy::$msg"
            exit 1
          fi
      - run: cargo test --workspace

  app:
    name: app (Svelte + Tauri, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Interface tests (vitest)
        run: npm test
      - name: Build the interface
        run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  real-recipes:
    name: real recipes on Windows 11-level build (apply → undo)
    needs: test
    # Windows Server 2025 = build 26100, the same kernel as Windows 11 24H2.
    runs-on: windows-2025
    env:
      PCO_CI_REAL_TWEAKS: "1"
      PCO_CI_TEST_SERVICE: PcoCiTestSvc
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal

      - name: Create a throwaway service for the service tests
        shell: pwsh
        run: |
          sc.exe create PcoCiTestSvc binPath= "C:\Windows\System32\svchost.exe -k PcoCiTestSvc" start= demand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Runner inventory (apps, adapters, power plans)
        shell: pwsh
        continue-on-error: true
        run: |
          "== provisioned =="; Get-AppxProvisionedPackage -Online | ForEach-Object { "$($_.DisplayName) | $($_.InstallLocation)" }
          "== user =="; Get-AppxPackage | ForEach-Object { "$($_.Name) | $($_.InstallLocation)" }
          "== adapters =="; Get-NetAdapter -Physical | Format-Table -AutoSize Name, InterfaceDescription, Status | Out-String
          Get-NetAdapter -Physical | Get-NetAdapterAdvancedProperty -AllProperties | Format-Table -AutoSize Name, RegistryKeyword, RegistryValue | Out-String -Width 200
          $class = 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e972-e325-11ce-bfc1-08002be10318}'
          Get-ChildItem $class -ErrorAction SilentlyContinue | ForEach-Object { $p = Get-ItemProperty $_.PSPath; "$($_.PSChildName) | $($p.DriverDesc) | Characteristics=$($p.Characteristics) | PnP=$($p.PnPCapabilities)" }
          "== power =="; powercfg /list; powercfg /query SCHEME_CURRENT 2a737441-1930-4402-8d77-b2bebba308a3; powercfg /query SCHEME_CURRENT 54533251-82be-4824-96c1-47b60b740d00 0cc5b647-c1df-4637-891a-dec35c318583

      - name: Apply and undo every recipe for real
        run: cargo test -p pco-core --test real_recipes -- --ignored --test-threads=1 --nocapture

      - name: Elevated helper over the real pipe (apply → undo, benchmark with the hot key)
        shell: pwsh
        run: |
          ./scripts/fetch-presentmon.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -q -p pco-frame-demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p pco-helper --test pipe -- --ignored --test-threads=1 --nocapture
          exit $LASTEXITCODE

      - name: Smoke-test the pco binary
        shell: pwsh
        run: |
          $env:PCO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pco'
          cargo run -q -p pco-cli -- --lang en list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -q -p pco-cli -- --lang ro status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Stage 1: read-only health report, as text and as JSON.
          cargo run -q -p pco-cli -- --lang ro health
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $json = (cargo run -q -p pco-cli -- health --json) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = $json | ConvertFrom-Json
          $count = @($report.findings).Count
          Write-Host "::notice title=pco health on the runner::build $($report.hardware.windows.build), $count findings, probe errors: $(@($report.hardware.probe_errors) -join '; ')"

      - name: Interrupted apply is undone at the next start (exit criterion 2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Errors as annotations: they show on the run page even without signing in.
          function Fail([string]$message) { Write-Host "::error title=Interruption test::$message"; exit 1 }
          $env:PCO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pco-interrupt'
          $snaps = Join-Path $env:RUNNER_TEMP 'snaps'
          $key = 'HKCU\Software\Microsoft\GameBar'
          cargo build -q -p pco-cli
          $pco = '.\target\debug\pco.exe'

          # Give Game Mode something to change (it is the first recipe written), remembering
          # the runner's own value.
          $orig = reg.exe query $key /v AutoGameModeEnabled 2>$null
          $hadValue = $LASTEXITCODE -eq 0
          reg.exe add $key /v AutoGameModeEnabled /t REG_DWORD /d 0 /f | Out-Null

          ./scripts/vm-snapshot.ps1 -Out "$snaps\before"
          if ($LASTEXITCODE -ne 0) { Fail "snapshot failed: $LASTEXITCODE" }

          # Stop abruptly right after the first change, like a crash.
          $env:PCO_TEST_STOP_AFTER_CHANGES = '1'
          $applyOut = (& $pco --lang en apply gaming.game-mode-on gaming.game-dvr-off privacy.advertising-id-off 2>&1) -join ' | '
          $applyCode = $LASTEXITCODE
          Remove-Item Env:PCO_TEST_STOP_AFTER_CHANGES
          if ($applyCode -ne 99) { Fail "expected the deliberate stop (99), got $applyCode. Output: $applyOut" }

          # The next start must undo it and say so.
          $out = (& $pco --lang en status 2>&1) -join ' | '
          $statusCode = $LASTEXITCODE
          Write-Host $out
          if ($statusCode -ne 0) { Fail "pco status failed ($statusCode). Output: $out" }
          if ($out -notmatch 'was interrupted\. I undid it automatically: 1 change restored') {
            Fail "the recovery message is missing. Output: $out"
          }
          $cmp = (./scripts/vm-snapshot.ps1 -Out "$snaps\after" -CompareWith "$snaps\before" 6>&1) -join ' | '
          if ($LASTEXITCODE -ne 0) { Fail "the registry is not exactly as before: $cmp" }
          Write-Host "::notice title=Interruption test::stopped after 1 change; the next start undid it; registry identical"

          # Put the runner's own value back.
          if ($hadValue) {
            $data = ($orig | Select-String 'AutoGameModeEnabled').ToString().Trim() -split '\s+' | Select-Object -Last 1
            reg.exe add $key /v AutoGameModeEnabled /t REG_DWORD /d ([Convert]::ToInt32($data, 16)) /f | Out-Null
          } else {
            reg.exe delete $key /v AutoGameModeEnabled /f | Out-Null
          }

      - name: VM test script (docs/TESTARE-ETAPA-0.md, tests A-D) in Windows PowerShell 5.1
        shell: powershell
        run: |
          cargo build -q -p pco-cli
          .\scripts\vm-test.ps1 -Pco .\target\debug\pco.exe -Work "$env:RUNNER_TEMP\vm-test" -IAmInAThrowawayWindows
          exit $LASTEXITCODE

      - name: Benchmark end to end (pinned PresentMon measuring a test app)
        shell: pwsh
        run: |
          function Fail([string]$m) { Write-Host "::error title=Benchmark::$m"; exit 1 }
          ./scripts/fetch-presentmon.ps1
          if ($LASTEXITCODE -ne 0) { Fail "PresentMon download or SHA-256 check failed ($LASTEXITCODE)" }
          cargo build -q -p pco-cli -p pco-frame-demo
          $env:PCO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pco-bench'
          $demo = Start-Process -FilePath .\target\debug\pco-frame-demo.exe -ArgumentList 150 -PassThru
          Start-Sleep -Seconds 5
          $common = @('--runs', '2', '--duration', '15', '--warmup', '1', '--no-launch', '--start-now')
          $before = (& .\target\debug\pco.exe --lang en bench run pco-frame-demo.exe --before @common 2>&1) -join ' | '
          $code = $LASTEXITCODE
          Write-Host $before
          if ($code -ne 0) { Stop-Process -Id $demo.Id -Force; Fail "pco bench --before failed ($code): $before" }
          $after = (& .\target\debug\pco.exe --lang en bench run pco-frame-demo.exe --after @common 2>&1) -join ' | '
          $code = $LASTEXITCODE
          Stop-Process -Id $demo.Id -Force -ErrorAction SilentlyContinue
          Write-Host $after
          if ($code -ne 0) { Fail "pco bench --after failed ($code): $after" }
          if ($after -notmatch 'before → after') { Fail "no comparison in: $after" }
          $runs = [regex]::Matches($before + $after, 'average FPS ([0-9.]+), 1% low ([0-9.]+)')
          if ($runs.Count -ne 4) { Fail "expected 4 runs, got $($runs.Count): $before $after" }
          foreach ($m in $runs) {
            $fps = [double]$m.Groups[1].Value; $low = [double]$m.Groups[2].Value
            if ($fps -le 0 -or $low -gt $fps + 0.05) { Fail "implausible run: $($m.Value)" }
          }
          Write-Host "::notice title=Benchmark end to end::$(($runs | ForEach-Object Value) -join '; ')"

      - name: Benchmark diagnostics (only when the benchmark failed)
        if: failure()
        shell: pwsh
        run: |
          function Note([string]$t, [string]$m) { Write-Host "::warning title=$t::$($m -replace '\r?\n', ' | ')" }
          $pm = '.\vendor\presentmon\PresentMon-2.6.0-x64.exe'
          $dwm = @(Get-Process dwm -ErrorAction SilentlyContinue).Count
          $session = (Get-Process -Id $PID).SessionId
          Note 'Desktop' "dwm processes: $dwm; this shell's session: $session; interactive: $([Environment]::UserInteractive)"
          $out = Join-Path $env:RUNNER_TEMP 'demo-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'demo-err.txt'
          $demo = Start-Process -FilePath .\target\debug\pco-frame-demo.exe -ArgumentList 40 -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 3
          Note 'Demo' "running after 3 s: $(-not $demo.HasExited); session $($demo.SessionId)"
          foreach ($extra in @(@(), @('--no_track_display'), @('--no_track_display', '--no_track_gpu', '--no_track_input'))) {
            $csv = Join-Path $env:RUNNER_TEMP "diag-$($extra.Count).csv"
            $log = (& $pm --process_name pco-frame-demo.exe --output_file $csv --timed 6 --terminate_after_timed `
              --no_console_stats --session_name PcoDiag --stop_existing_session @extra 2>&1) -join ' '
            $code = $LASTEXITCODE
            $lines = if (Test-Path $csv) { @(Get-Content $csv).Count } else { 'no file' }
            Note "PresentMon $($extra -join ' ')" "exit $code; CSV lines: $lines; header: $(if (Test-Path $csv) { (Get-Content $csv -TotalCount 1) }); said: $log"
          }
          # All processes, no filter: does PresentMon see any presents at all?
          $csv = Join-Path $env:RUNNER_TEMP 'diag-all.csv'
          $log = (& $pm --output_file $csv --timed 6 --terminate_after_timed --no_console_stats `
            --session_name PcoDiag --stop_existing_session 2>&1) -join ' '
          $apps = if (Test-Path $csv) { (Import-Csv $csv | Group-Object Application | ForEach-Object { "$($_.Name)=$($_.Count)" }) -join ', ' } else { 'no file' }
          Note 'PresentMon all processes' "exit $LASTEXITCODE; frames per app: $apps; said: $log"
          if (-not $demo.HasExited) { Stop-Process -Id $demo.Id -Force }
          Note 'Demo output' "$(Get-Content $out -Raw) / $(Get-Content $err -Raw)"

      - name: Remove the throwaway service
        if: always()
        shell: pwsh
        run: sc.exe delete PcoCiTestSvc
