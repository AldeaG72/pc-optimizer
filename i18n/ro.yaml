health.ram_channels.fix: "Folosește două module identice, în sloturile indicate în manualul plăcii de bază (de obicei A2 și B2)."

health.display_refresh.title: "Frecvența monitorului"
health.display_refresh.problem: "{subject} rulează la {current} Hz, dar suportă {max} Hz."
health.display_refresh.fix: "Setări → Sistem → Ecran → Ecran avansat → Rată de reîmprospătare: alege {max} Hz. Verifică și cablul (DisplayPort sau HDMI 2.0+)."

health.display_resolution.title: "Rezoluția nativă a monitorului"
health.display_resolution.warning: "{subject} rulează la {current}, dar rezoluția lui nativă e {native}. Imaginea e scalată și mai puțin clară."
health.display_resolution.fix: "Setări → Sistem → Ecran → Rezoluție ecran: alege {native} (marcată „Recomandat”)."

health.hdr.title: "HDR"
health.hdr.info: "HDR e pornit pe {subject}. În jocurile competitive recomandăm să fie oprit."
health.hdr.fix: "Setări → Sistem → Ecran → Utilizează HDR: oprit, când joci competitiv."

health.auto_hdr.title: "Auto HDR"
health.auto_hdr.info: "Auto HDR e pornit. Schimbă culorile jocurilor și poate adăuga o mică întârziere."
health.auto_hdr.fix: "Setări → Sistem → Ecran → Grafică → Auto HDR: oprit."

health.gpu_driver.title: "Driver video"
health.gpu_driver.warning: "Driverul pentru {subject} ({version}, din {date}) are aproximativ {months} luni."
health.gpu_driver.fix: "Instalează cel mai nou driver de pe site-ul oficial al producătorului (linkul de mai jos)."

health.vbs.title: "Securitate bazată pe virtualizare (VBS / Memory Integrity)"
health.vbs.info: "VBS e activ (Memory Integrity: {hvci}). Protejează sistemul, dar pe unele procesoare costă câteva procente de FPS."
health.vbs.fix: "Nu e o eroare. Oprirea scade securitatea; o vom oferi doar ca tweak avansat, cu avertisment."

health.power_plan.title: "Planul de alimentare"
health.power_plan.problem: "Planul de alimentare activ e „{plan}”, care limitează performanța."
health.power_plan.warning: "Planul de alimentare activ e „{plan}”, care limitează performanța (pe laptop prelungește bateria)."
health.power_plan.fix: "Setări → Sistem → Alimentare: alege „Echilibrat” sau „Performanță maximă” când joci."

health.on_battery.title: "Laptop pe baterie"
health.on_battery.warning: "Laptopul e pe baterie: procesorul și placa video rulează mai încet."
health.on_battery.fix: "Pentru jocuri, ține laptopul la priză."

health.game_gpu.title: "Placa video pentru jocuri"
health.game_gpu.problem: "{subject} e setat să ruleze pe placa integrată, nu pe {gpu}."
health.game_gpu.info: "Pentru {subject}, Windows alege singur placa video. Pe un PC cu două plăci e mai sigur să alegi {gpu}."
health.game_gpu.fix: "Setări → Sistem → Ecran → Grafică → alege jocul → Opțiuni → „Performanță ridicată”."

health.game_disk.title: "Jocuri pe SSD"
health.game_disk.warning: "{subject} e instalat pe un HDD ({drive}). Încărcările sunt mai lente și pot apărea sacade."
health.game_disk.fix: "Mută jocul pe un SSD din launcher (Steam, Epic, Riot și EA app au o opțiune de mutare)."

health.trim.title: "TRIM pentru SSD"
health.trim.problem: "TRIM e dezactivat, așa că SSD-ul încetinește în timp."
health.trim.fix: "Într-un PowerShell deschis ca administrator: fsutil behavior set DisableDeleteNotify 0"

health.disk_health.title: "Sănătatea discurilor"
health.disk_health.problem: "Windows raportează discul {subject} ca nesănătos (SMART)."
health.disk_health.fix: "Fă imediat o copie de siguranță a datelor importante și înlocuiește discul."

health.free_space.title: "Spațiu liber"
health.free_space.warning: "Pe {subject} mai sunt liberi doar {free_gb} GB ({percent}%)."
health.free_space.fix: "Eliberează spațiu: Setări → Sistem → Stocare → Recomandări de curățare."

health.other_optimizers.title: "Alte optimizatoare"
health.other_optimizers.warning: "Sunt instalate și alte optimizatoare: {list}. Setările lor se pot bate cap în cap cu ale noastre."
health.other_optimizers.fix: "Folosește un singur optimizator. Dacă îl păstrezi și pe celălalt, nu aplica aceleași setări din amândouă."

health.overlays.title: "Overlay-uri în joc"
health.overlays.info: "Aplicații cu overlay instalate: {list}. Overlay-urile pot costa FPS și pot adăuga întârziere."
health.overlays.fix: "Oprește overlay-ul din setările fiecărei aplicații (Discord: Setări → Game Overlay; Steam: Setări → În joc)."

health.managed.title: "PC administrat de o organizație"
health.managed.info: "PC-ul e administrat de o organizație (domeniu sau Intune). Unele setări pot fi suprascrise de politicile ei."
health.managed.fix: "Nu trebuie să faci nimic; dacă o setare revine singură, asta e cauza."

