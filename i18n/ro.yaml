health.ram_speed.fix: "Profilul XMP/EXPO se pornește din BIOS. Aplicația nu modifică BIOS-ul; caută „XMP” sau „EXPO” în manualul plăcii de bază."

health.ram_channels.title: "Memorie în dual-channel"
health.ram_channels.problem: "Memoria rulează single-channel ({modules} module pe un singur canal). Asta poate costa mult FPS în jocuri."
