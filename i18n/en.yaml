health.ram_speed.title: "Memory speed"
health.ram_speed.warning: "Memory runs at {running} MHz, below its standard speed of {rated} MHz."
health.ram_speed.info: "Memory runs at {running} MHz, a standard speed. If your modules are faster (see the label or specs), the XMP/EXPO profile is probably off."
health.ram_speed.fix: "XMP/EXPO is turned on in the BIOS. The app does not touch the BIOS; look for “XMP” or “EXPO” in your motherboard manual."

health.ram_channels.title: "Dual-channel memory"
health.ram_channels.problem: "Memory runs in single channel ({modules} modules on one channel). This can cost a lot of FPS in games."
health.ram_channels.warning: "Memory runs in single channel ({modules} modules on one channel). On laptops this often cannot be changed."
health.ram_channels.fix: "Use two identical modules, in the slots your motherboard manual recommends (usually A2 and B2)."

health.display_refresh.title: "Monitor refresh rate"
health.display_refresh.problem: "{subject} runs at {current} Hz but supports {max} Hz."
health.display_refresh.fix: "Settings → System → Display → Advanced display → Choose a refresh rate: {max} Hz. Also check the cable (DisplayPort or HDMI 2.0+)."

health.display_resolution.title: "Native monitor resolution"
health.display_resolution.warning: "{subject} runs at {current}, but its native resolution is {native}. The image is scaled and less sharp."
health.display_resolution.fix: "Settings → System → Display → Display resolution: choose {native} (marked “Recommended”)."

health.hdr.title: "HDR"
health.hdr.info: "HDR is on for {subject}. For competitive games we recommend turning it off."
health.hdr.fix: "Settings → System → Display → Use HDR: off, when playing competitively."

health.auto_hdr.title: "Auto HDR"
health.auto_hdr.info: "Auto HDR is on. It changes game colors and can add a little latency."
health.auto_hdr.fix: "Settings → System → Display → Graphics → Auto HDR: off."

health.gpu_driver.title: "Graphics driver"
health.gpu_driver.warning: "The driver for {subject} ({version}, from {date}) is about {months} months old."
health.gpu_driver.fix: "Install the latest driver from the manufacturer's official site (link below)."

health.vbs.title: "Virtualization-based security (VBS / Memory Integrity)"
health.vbs.info: "VBS is active (Memory Integrity: {hvci}). It protects the system, but on some CPUs costs a few percent of FPS."
health.vbs.fix: "This is not an error. Turning it off lowers security; we will only offer it as an advanced tweak, with a warning."

health.power_plan.title: "Power plan"
health.power_plan.problem: "The active power plan is “{plan}”, which limits performance."
health.power_plan.warning: "The active power plan is “{plan}”, which limits performance (on a laptop it extends battery life)."
health.power_plan.fix: "Settings → System → Power: choose “Balanced” or “Best performance” when gaming."

health.on_battery.title: "Laptop on battery"
health.on_battery.warning: "The laptop is on battery: the CPU and GPU run slower."
health.on_battery.fix: "Keep the laptop plugged in when gaming."

health.game_gpu.title: "GPU used for games"
health.game_gpu.problem: "{subject} is set to run on the integrated GPU, not on the {gpu}."
health.game_gpu.info: "For {subject}, Windows picks the GPU itself. On a PC with two GPUs it is safer to choose the {gpu}."
health.game_gpu.fix: "Settings → System → Display → Graphics → pick the game → Options → “High performance”."

health.game_disk.title: "Games on an SSD"
health.game_disk.warning: "{subject} is installed on an HDD ({drive}). Loading is slower and stutters can appear."
health.game_disk.fix: "Move the game to an SSD from its launcher (Steam, Epic, Riot and the EA app have a move option)."

health.trim.title: "TRIM for SSDs"
health.trim.problem: "TRIM is turned off, so the SSD slows down over time."
health.trim.fix: "In PowerShell opened as administrator: fsutil behavior set DisableDeleteNotify 0"

health.disk_health.title: "Disk health"
health.disk_health.problem: "Windows reports the disk {subject} as unhealthy (SMART)."
health.disk_health.fix: "Back up your important data now and replace the disk."

health.free_space.title: "Free space"
health.free_space.warning: "Only {free_gb} GB ({percent}%) is free on {subject}."
health.free_space.fix: "Free up space: Settings → System → Storage → Cleanup recommendations."

health.other_optimizers.title: "Other optimizers"
health.other_optimizers.warning: "Other optimizers are installed: {list}. Their settings can conflict with ours."
health.other_optimizers.fix: "Use one optimizer. If you keep the other one, do not apply the same settings from both."

health.overlays.title: "In-game overlays"
health.overlays.info: "Apps with overlays installed: {list}. Overlays can cost FPS and add latency."
health.overlays.fix: "Turn the overlay off in each app's settings (Discord: Settings → Game Overlay; Steam: Settings → In Game)."

health.managed.title: "PC managed by an organization"
health.managed.info: "This PC is managed by an organization (domain or Intune). Some settings may be overridden by its policies."
health.managed.fix: "Nothing to do; if a setting reverts by itself, this is why."

